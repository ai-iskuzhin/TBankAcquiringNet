name: Publish NuGet

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: 'Git ref to publish from, for example v0.1.0-preview.1'
        required: true
        type: string
      version:
        description: 'Package version to publish, for example 0.1.0-preview.1'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish NuGet Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.git_ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TBankAcquiringNet.slnx

      - name: Build
        run: dotnet build TBankAcquiringNet.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test TBankAcquiringNet.slnx --configuration Release --no-build --verbosity normal

      - name: Pack Requested Version
        run: >
          dotnet pack src/TBankAcquiringNet/TBankAcquiringNet.csproj
          --configuration Release
          --no-build
          --output artifacts/packages
          -p:PackageVersion=${{ inputs.version }}
          -p:Version=${{ inputs.version }}
          -p:InformationalVersion=${{ inputs.version }}

      - name: Publish Package
        run: >
          dotnet nuget push artifacts/packages/TBankAcquiringNet.${{ inputs.version }}.nupkg
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --skip-duplicate

      - name: Publish Symbols
        run: >
          dotnet nuget push artifacts/packages/TBankAcquiringNet.${{ inputs.version }}.snupkg
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --skip-duplicate
